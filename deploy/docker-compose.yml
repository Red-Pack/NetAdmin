services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: remote_admin
      POSTGRES_USER: remote_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_admin -d remote_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://remote_admin:${POSTGRES_PASSWORD:-change-me}@db:5432/remote_admin?sslmode=disable
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:?Set AGENT_ENROLLMENT_TOKEN in .env}
      OFFLINE_AFTER: ${OFFLINE_AFTER:-90s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
